<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Azure-Outlook</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <!-- Fluent UI -->
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/9.6.1/css/fabric.min.css"/>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-Fabric">
    <!-- Header -->
    <header class="app-header">
        <img width="32" height="32" src="../../assets/logo-filled.png" alt="Logo" />
        <span class="app-title ms-font-l">Azure DevOps</span>
    </header>

    <!-- Status banner -->
    <div id="status-banner" class="status-banner" style="display:none;"></div>

    <!-- Sideload message -->
    <section id="sideload-msg" class="sideload-msg">
        <p class="ms-font-l">Please sideload your add-in to see app body.</p>
    </section>

    <!-- Tab navigation -->
    <nav id="tab-nav" class="tab-nav" style="display:none;">
        <button class="tab-btn active" data-tab="create">Create Ticket</button>
        <button class="tab-btn" data-tab="search">Search Items</button>
        <button class="tab-btn" data-tab="insert">Insert into Email</button>
    </nav>

    <!-- CREATE TAB -->
    <section id="tab-create" class="tab-panel" style="display:none;">
        <h3 class="ms-font-m-plus">Create Work Item</h3>

        <div class="form-group">
            <label class="form-label">Work item type:</label>
            <div id="work-item-types" class="radio-group"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="parent-search">Parent item:</label>
            <input type="text" id="parent-search" class="form-input" placeholder="Search by title or ID..." autocomplete="off" />
            <div id="parent-results" class="parent-results"></div>
            <div id="selected-parent" class="selected-parent" style="display:none;"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="item-subject">Title:</label>
            <input type="text" id="item-subject" class="form-input" autocomplete="off" />
        </div>

        <div class="form-group">
            <label class="form-label" for="team-select">Assign to:</label>
            <select id="team-select" class="form-select"></select>
        </div>

        <div class="form-group" id="attachments-group" style="display:none;">
            <label class="form-label">Attachments:</label>
            <div id="attachment-list"></div>
        </div>

        <button id="btn-create" class="btn btn-primary">Create Ticket</button>
    </section>

    <!-- SEARCH TAB -->
    <section id="tab-search" class="tab-panel" style="display:none;">
        <h3 class="ms-font-m-plus">Search Work Items</h3>
        <div class="search-bar">
            <input type="text" id="search-input" class="form-input" placeholder="Search by title or ID..." autocomplete="off" />
            <select id="search-type-filter" class="form-select form-select-small">
                <option value="">All types</option>
            </select>
        </div>
        <div id="search-results" class="search-results">
            <p class="placeholder-text">Enter a search term above.</p>
        </div>
    </section>

    <!-- INSERT TAB -->
    <section id="tab-insert" class="tab-panel" style="display:none;">
        <h3 class="ms-font-m-plus">Insert into Email</h3>
        <div id="insert-preview" class="insert-preview">
            <p class="placeholder-text">Select a work item from Search to preview.</p>
        </div>
        <button id="btn-insert" class="btn btn-primary" style="display:none;">Insert Card</button>
    </section>

</body>

</html>
